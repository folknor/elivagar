[package]
name = "elivagar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shortbread vector tile generator — reads OSM PBF files and produces PMTiles v3 archives"
repository = "https://github.com/folknor/elivagar"
readme = "README.md"
keywords = ["openstreetmap", "vector-tiles", "pmtiles", "shortbread", "tiles"]
categories = ["command-line-utilities", "science::geo"]

[[bin]]
name = "elivagar"
path = "src/main.rs"

[dependencies]
pbfhogg = { path = "../pbfhogg", default-features = false, features = ["zlib-ng"] }
rayon = "1.5"
memmap2 = "0.9"
flate2 = { version = "1.0", default-features = false, features = ["zlib-ng"] }
mimalloc = { version = "0.1", default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
pmtiles = { version = "0.20", default-features = false, features = ["write"] }

[lints.clippy]
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
too_many_lines = "deny"

[profile.release]
strip = true
lto = true
