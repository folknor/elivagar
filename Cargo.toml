[package]
name = "elivagar"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT OR Apache-2.0"
description = "Shortbread vector tile generator - reads OSM PBF files and produces PMTiles v3 archives"
repository = "https://github.com/folknor/elivagar"
readme = "README.md"
keywords = ["openstreetmap", "vector-tiles", "pmtiles", "shortbread", "tiles"]
categories = ["command-line-utilities", "science::geo"]
# Development state that is committed but has no business in a published
# crate: the corpus baseline and its SVG renders, transient notes, the
# benchmark database, the Node validation harness, and the agent-harness
# instructions - the last of those describe brokkr invocations against
# datasets and hosts a crates.io reader does not have.
#
# reference/ IS shipped: it is durable by convention and, with no docs site
# yet, it is the only long-form CLI and corpus documentation a reader gets.
#
# docs/ holds the VitePress site AND the two README logos. The site is
# excluded subpath by subpath rather than wholesale, because the logos have to
# ship for the crates.io README to render - docs/public/*.svg stays in, the
# fonts and page sources do not.
exclude = [
    "corpus/",
    "notes/",
    "research/",
    "overnight-logs/",
    "scripts/",
    ".brokkr/",
    "brokkr.toml",
    "overnight.sh",
    "tile_weights.tsv.gz",
    ".review.toml",
    "CLAUDE.md",
    "AGENTS.md",
    "docs/.vitepress/",
    "docs/public/fonts/",
    "docs/public/icons/",
    "docs/guide/",
    "docs/reference/",
    "docs/index.md",
    "package.json",
    "pnpm-lock.yaml",
    "pnpm-workspace.yaml",
]

[[bin]]
name = "elivagar"
path = "src/main.rs"

[build-dependencies]
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dependencies]
# Our PBF reader. The resolved lockfile version is read by build.rs and
# recorded in every archive's provenance block, so a bump here flows into
# provenance with no other edit needed.
pbfhogg = "0.5"
protohoggr = "0.4.0"
rayon = "1.5"
memmap2 = "0.9.11"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
brotli = "8.0.4"
lz4_flex = "0.14"
snap = "1"
smallvec = "1.15.2"
hotpath = "0.22.0"
rustc-hash = "2"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
toml = "1.1.3"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
mlt-core = { version = "0.12.3", optional = true }
geo-types = "0.7.19"
libc = "0.2"

[dev-dependencies]
i_overlay = "7.0"
serde_yaml = "0.9"
pmtiles = { version = "0.23", default-features = false, features = ["write"] }
tempfile = "3.27"

[lints.clippy]
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
too_many_lines = "deny"
needless_range_loop = "deny"
type_complexity = "deny"
collapsible_if = "deny"
manual_div_ceil = "deny"
new_without_default = "deny"
manual_flatten = "deny"
io_other_error = "deny"
# Determinism: the banned containers are listed in clippy.toml. std's
# HashMap/HashSet seed RandomState per process, so iterating one can reorder
# output between runs of the same binary on the same input.
disallowed_types = "deny"

[features]
# The system allocator is the allocator (see the note in main.rs; mimalloc
# and jemalloc lost the measured A/B at 98824b4 and were removed).
default = []
# MLT (MapLibre Tile) output. Off by default: the encoder is real and
# round-trips through mlt-core in tests, but no client has ever consumed its
# output, the path carries no per-tile compression, and no standing gate
# covers it (the corpus baseline, earcut oracle and verify are all MVT).
# Shipping it on by default would put an unvalidated wire format behind a
# stable-looking flag. mlt-core is pre-1.0 and moves; keeping the dep optional
# also keeps it out of the default build graph.
mlt = ["dep:mlt-core"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath", "hotpath/hotpath-alloc"]
# linux-io-uring = ["dep:io-uring", "dep:libc"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = 1
