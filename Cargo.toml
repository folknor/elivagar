[workspace]
members = ["crates/lib", "crates/cli", "crates/corpus", "crates/devkit", "crates/datasets", "crates/tools"]
# A plain build selects only the product, so it yields the one `elivagar`
# executable. The dev tools are built by name (`brokkr run elivagar-corpus`,
# `brokkr run --with elivagar elivagar-devkit`),
# and the check sweeps in brokkr.d/checks.toml list every package.
default-members = ["crates/lib", "crates/cli"]
# Explicit: edition 2024 implies resolver 3 only for a root package, and a
# virtual manifest has no edition, so without this it would drop to 1.
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
repository = "https://github.com/folknor/elivagar"

[workspace.lints.clippy]
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
too_many_lines = "deny"
needless_range_loop = "deny"
type_complexity = "deny"
collapsible_if = "deny"
manual_div_ceil = "deny"
new_without_default = "deny"
manual_flatten = "deny"
io_other_error = "deny"
# Determinism: the banned containers are listed in clippy.toml. std's
# HashMap/HashSet seed RandomState per process, so iterating one can reorder
# output between runs of the same binary on the same input.
disallowed_types = "deny"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = 1
