[package]
name = "elivagar"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Shortbread vector tile generator - reads OSM PBF files and produces PMTiles v3 archives"
repository = "https://github.com/folknor/elivagar"
readme = "README.md"
keywords = ["openstreetmap", "vector-tiles", "pmtiles", "shortbread", "tiles"]
categories = ["command-line-utilities", "science::geo"]

[[bin]]
name = "elivagar"
path = "src/main.rs"

[dependencies]
pbfhogg = { path = "../pbfhogg" }
protohoggr = { path = "../protohoggr" }
rayon = "1.5"
memmap2 = "0.9.11"
flate2 = { version = "1.0", default-features = false, features = ["zlib-rs"] }
brotli = "8.0.4"
lz4_flex = "0.13"
snap = "1"
smallvec = "1.15.2"
mimalloc = { version = "0.1.52", default-features = false, optional = true }
libmimalloc-sys = { version = "0.1", features = ["extended"], optional = true }
tikv-jemallocator = { version = "0.7", optional = true }
hotpath = "0.21.1"
rustc-hash = "2"
clap = { version = "4.6", features = ["derive"] }
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
mlt-core = "0.12.3"
geo-types = "0.7.19"
i_overlay = "7.0"
libc = "0.2"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
pmtiles = { version = "0.23", default-features = false, features = ["write"] }
tempfile = "3.27"

[lints.clippy]
uninlined_format_args = "deny"
cloned_instead_of_copied = "deny"
redundant_closure_for_method_calls = "deny"
semicolon_if_nothing_returned = "deny"
manual_string_new = "deny"
explicit_iter_loop = "deny"
implicit_clone = "deny"
needless_pass_by_value = "deny"
unnecessary_sort_by = "deny"
collapsible_match = "deny"
if_same_then_else = "deny"
needless_borrow = "deny"
ptr_arg = "deny"
redundant_locals = "deny"
regex_creation_in_loops = "deny"
unnecessary_unwrap = "deny"
wrong_self_convention = "deny"
let_underscore_must_use = "deny"
unwrap_in_result = "deny"
ok_expect = "deny"
await_holding_lock = "deny"
await_holding_refcell_ref = "deny"
too_many_arguments = "deny"
large_enum_variant = "deny"
clone_on_ref_ptr = "deny"
float_cmp = "deny"
cognitive_complexity = "deny"
cast_sign_loss = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
unwrap_used = "deny"
too_many_lines = "deny"
needless_range_loop = "deny"
type_complexity = "deny"
collapsible_if = "deny"
manual_div_ceil = "deny"
new_without_default = "deny"
manual_flatten = "deny"
io_other_error = "deny"

[features]
default = ["mimalloc-alloc"]
mimalloc-alloc = ["dep:mimalloc", "dep:libmimalloc-sys"]
jemalloc-alloc = ["dep:tikv-jemallocator"]
hotpath = ["hotpath/hotpath"]
hotpath-alloc = ["hotpath/hotpath", "hotpath/hotpath-alloc"]
# linux-io-uring = ["dep:io-uring", "dep:libc"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
strip = false
debug = 1
