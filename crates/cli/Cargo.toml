[package]
name = "elivagar-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Shortbread vector tile generator command line - OSM PBF in, PMTiles v3 out"
readme = "../../README.md"
keywords = ["openstreetmap", "vector-tiles", "pmtiles", "shortbread", "cli"]
categories = ["command-line-utilities", "science::geo"]

# The binary keeps its name: `cargo install elivagar-cli` installs `elivagar`.
# Tests that drive the binary live in this package, because cargo hands
# CARGO_BIN_EXE_elivagar only to the package that owns the bin.
[[bin]]
name = "elivagar"
path = "src/main.rs"

[dependencies]
elivagar = { version = "0.2.0", path = "../lib" }
clap = { version = "4.6", features = ["derive"] }
hotpath = "0.31.3"
# The global pool's thread count, set from --threads before the run starts.
rayon = "1.5"

[dev-dependencies]
libc = "0.2"
pbfhogg = "0.6.0"
serde_json = "1"
tempfile = "3.27"

[lints]
workspace = true

[features]
default = []
mlt = ["elivagar/mlt"]
hotpath = ["hotpath/hotpath", "elivagar/hotpath"]
hotpath-alloc = ["hotpath/hotpath", "hotpath/hotpath-alloc", "elivagar/hotpath-alloc"]
