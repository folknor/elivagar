[package]
name = "elivagar-devkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "brokkr.toml host config, git, the tilegen archive store, and the tilegen and ocean-build drivers"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "elivagar-devkit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
# brokkr.toml composition and the typed tilegen block.
toml = "1.1.3"
serde = { version = "1", features = ["derive"] }
# The registered XXH128 dataset pins.
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[lints]
workspace = true
