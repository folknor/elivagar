[package]
name = "elivagar-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "One-time installation of the competitor toolchains (pinned JDK, Planetiler, Tilemaker) and their prepared inputs"
publish = false

[[bin]]
name = "elivagar-tools"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
elivagar-devkit = { path = "../devkit" }
# Validating the shortbread-tilemaker config before and after its sources
# are made absolute. Read only: no preserve_order, so the workspace's
# serde_json is not unified onto a different Map type.
serde_json = "1"
# The pinned JDK and Planetiler release digests.
sha2 = "0.10"

[lints]
workspace = true
