project = "elivagar"

# The rest of the config lives in brokkr.d/: check sweeps and test settings,
# text lints and script checks, the script bench registry, and one file per host holding its paths,
# drives, tilegen contract and datasets.
include = [
    "brokkr.d/checks.toml",
    "brokkr.d/lints.toml",
    "brokkr.d/benches.toml",
    "brokkr.d/hosts/plantasjen.toml",
    "brokkr.d/hosts/bygg.toml",
    "brokkr.d/hosts/dm6.toml",
]

# Env variables that match these are captured by brokkr during runs and stored in the database.
capture_env = ["ELIVAGAR*", "MALLOC*"]

[bin]
default = "elivagar"
install = ["elivagar-cli"]

# crates/lib/build.rs's provenance rerun trigger: a content hash of the source
# inputs (HEAD tree, tracked patch, untracked file contents, Cargo.lock),
# evaluated before every cargo call. build.rs reruns, and the crate
# recompiles, only when it changes; without it build.rs reruns on every
# build, which stays exact but recompiles every target. See build.rs.
#
# `if_exists` leaves the variable unset in a `brokkr --commit` worktree older
# than the script, which build.rs treats exactly like plain cargo. The name is
# not ELIVAGAR_*, because brokkr refuses a cargo_env name capture_env matches.
#
# Build-cost hazard: when the script cannot describe the tree, or cannot read
# crates/lib/build/source_inputs.toml, it prints a value unique per call, so
# every cargo call recompiles the crate while every gate stays green. The
# `source-identity-stable` script check in brokkr.d/lints.toml turns that red.
[cargo_env]
ELV_SOURCE_IDENTITY = { command = "python3 scripts/source_identity.py", if_exists = "scripts/source_identity.py" }
