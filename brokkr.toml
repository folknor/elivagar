# Fat-blob proxy for the planet way-admission regime, built 2026-07-31 by
#   pbfhogg repack --elements-per-blob 66000 --compression zstd:1
# from germany locations-prepass. 1055 way blobs at 4.36 MB compressed each,
# against planet's 4.8 MB - close enough to reproduce the way_budget
# admission collapse (H3 fat-blob item) at germany wall times instead of
# 10-minute planet runs. NOTE repack does NOT preserve the injected
# WayMembers-v1 / SharedNodePins-v1 metadata and says so; this variant is
# LocationsOnWays only, so it runs the RUNTIME prepass and is NOT comparable
# to the prepass-carrying locations variant. It is an instrument for sweeping
# way_budget against itself, not a dataset for baselines.
[bygg.datasets.germany.pbf.locations-fat]
file = "germany-20260224-seq4704-locations-prepass-fat.osm.pbf"
xxhash = "98ec8cfda0b6a684b0f1094b3cd21784"
seq = 4704

