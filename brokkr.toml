[bygg]
data = "data"
scratch = "data/tilegen_tmp"
target = "target"

# Single WD_BLACK SN850X 4TB NVMe holds root, data, scratch and target.
[bygg.drives]
source = "nvme"
data = "nvme"
scratch = "nvme"
target = "nvme"

# Contract rsync'd from plantasjen 2026-07-30: same shapefile releases and the
# same ocean-tiles.pmtiles artifact generation.
[bygg.tilegen.default]
# Sort chunks stay uncompressed on bygg, decided by measurement 2026-08-07:
# the H4 lz4 arm at planet (run bf2fdfe2) lost to the uncompressed control
# (ac2cf674) 662.0s vs 587.2s wall, assemble 284.1s vs 224.5s, and its
# assemble peak RSS read 24.5 GB against 6.7 GB uncompressed - even though
# physical assemble reads fell 421 GB to 170 GB. On a single fast NVMe the
# decompress CPU and the read path's memory behavior cost more than the
# I/O saves. Do not re-add without a fresh planet A/B.
ocean = [
    "z0-z7:simplified-water-polygons-split-3857/simplified_water_polygons.shp",
    "z8-z14:water-polygons-split-3857/water_polygons.shp",
    "ocean-tiles.pmtiles",
]

