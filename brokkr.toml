[dm6]
data = "data"
scratch = "data/tilegen_tmp"
target = "target"

[dm6.drives]
source = "nvme"
data = "nvme"
scratch = "nvme"
target = "nvme"

# Shapefiles only - the paths `brokkr download-ocean` extracts to. dm6 has no
# ocean-tiles.pmtiles registered because building one is an `ocean-build` run
# per shapefile release, not per host; add the line here once it has one.
[dm6.tilegen.default]
ocean = [
    "z0-z7:simplified-water-polygons-split-3857/simplified_water_polygons.shp",
    "z8-z14:water-polygons-split-3857/water_polygons.shp",
