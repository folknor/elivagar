# The planet input for the H9 ladder. Enriched on bygg 2026-07-31 from
# pbfhogg's planet-20260223-with-indexdata.osm.pbf (the seq-4912 snapshot
# registered in pbfhogg's own brokkr.toml) via
#   pbfhogg add-locations-to-ways --index-type external --inject-prepass
#     --compression zstd:1
# Header carries LocationsOnWays plus pbfhogg.WayMembers-v1 and
# pbfhogg.SharedNodePins-v1, so elivagar reads the injected relation plan and
# exact shared-node pins instead of running the runtime prepass. There is a
# pre-existing planet-20260223-altw.osm.pbf next to it in pbfhogg/data with
# NEITHER injected feature - it is the plain-altw arm and is NOT this file.
# Only the locations variant is registered: tilegen consumes no other, and the
# raw and indexed planet PBFs stay in pbfhogg/data where they are produced.
# The file here is a hard link to that same inode, not a copy.
[bygg.datasets.planet]
origin = "planet.openstreetmap.org"
download_date = "2026-03-07"

[bygg.datasets.planet.pbf.locations]
file = "planet-20260223-locations-prepass.osm.pbf"
xxhash = "2cc18188274482abe0a6f58b9d44c78f"
seq = 4912

