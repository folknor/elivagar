project = "elivagar"

# Env variables that match these are captured by brokkr during runs and stored in the database.
capture_env = ["ELIVAGAR*", "MALLOC*"]

# ---------------------------------------------------------------------------
# Per-machine configuration
# ---------------------------------------------------------------------------

[plantasjen]
data = "data"
scratch = "data/tilegen_tmp"
target = "target"

# All four paths verified 2026-07-09: data/scratch/target resolve to
# /dev/nvme1n1p1 (Banan), source to the same; rotational=0. The old
# ssd/hdd classes were stale hardware.
[plantasjen.drives]
source = "nvme"
data = "nvme"
scratch = "nvme"
target = "nvme"

# The tilegen contract. `brokkr tilegen` is configured entirely from here -
# there are no override flags, and nothing is auto-detected. brokkr used to
# stat data/ for the ocean shapefiles and pass whichever it found, which meant
# two runs of the same binary on the same PBF could produce different ocean
# geometry with nothing in the recorded invocation saying which; on 2026-07-14
# a denmark archive was built, verified and blessed as the regress baseline
# while ocean-tiles.pmtiles was absent, taking the computed path throughout
# while every gate passed.
#
# Paths are relative to `data` above, like every other path in this file.
# Omitting `ocean` entirely means no ocean - the statement the removed
# --no-ocean flag used to make. Drop the .pmtiles line for an
# artifact-absent arm; `brokkr results --grep-v ocean-tiles` selects it.
[plantasjen.tilegen.default]
ocean = [
    "z0-z7:simplified-water-polygons-split-3857/simplified_water_polygons.shp",
    "z8-z14:water-polygons-split-3857/water_polygons.shp",
    "ocean-tiles.pmtiles",
]

