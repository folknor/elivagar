# brokkr check + test sweeps.
#
# Replaces brokkr's legacy fallback (one --all-features sweep) with the
# default-features build, and fans the test binaries out concurrently
# (prebuilt binaries executed directly, budget = tests in flight, defaulting
# to the L3 cache domain - the right default for a compute-bound suite).
# Until 2026-09-02 the suite ran libtest's serial default, so this is its
# first parallelism; the per-test watchdog is kept. A crate-thin workspace
# caps the win at the binary count - read the `claims N-M` line and the two
# fan-out summary lines to see what it actually bought, and remember the
# first run weights by test count and is always the slow one.
#
# Packages are named because the workspace's default-members leave out the
# gate tool (so a plain build yields one executable); a sweep must not.
[[check]]
name = "default"
packages = ["elivagar", "elivagar-cli", "elivagar-corpus", "elivagar-devkit", "elivagar-datasets", "elivagar-tools"]
parallel = {}

# The mlt feature: the encoder, its mlt-core round-trip tests and the
# mlt-gated pipeline tests, which no sweep compiled before. default still
# covers the not-mlt refusal test, so both sweeps stay. The gate tool has no
# mlt feature and reads MVT only, so it is not in this sweep.
[[check]]
name = "mlt"
packages = ["elivagar", "elivagar-cli"]
features = ["mlt"]
parallel = {}

# `brokkr test` defaults to release; `brokkr check` runs the dev profile.
# Matching them keeps a single-test timing honest against the 20s per-test
# cap check enforces - a release run hid a 30s debug test at 5s.
[test]
debug = true
default_package = "elivagar"
