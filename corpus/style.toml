# Canonical corpus render style. [[layer]] order is paint order, bottom first.
background = "#f2efe9"

[[layer]]
name = "ocean"
fill = "#aad3df"
[[layer]]
name = "land"
# Every kind is_known_land_kind() accepts has a match below (colors follow
# OSM Carto where one exists); the base fill only catches unknown kinds.
fill = "#f2efe9"
[[layer.match]]
key = "kind"
value = "residential"
fill = "#e0dfdf"
[[layer.match]]
key = "kind"
value = "commercial"
fill = "#f2dad9"
[[layer.match]]
key = "kind"
value = "retail"
fill = "#ffd6d1"
[[layer.match]]
key = "kind"
value = "industrial"
fill = "#ebdbe8"
